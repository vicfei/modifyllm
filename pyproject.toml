[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modifyllm"
version = "0.2.0"
description = "Modify with receipts: verified, auditable, rollbackable model modification (edit / finetune / distill / merge)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
hf = ["torch>=2.2", "transformers>=4.44", "peft>=0.11", "huggingface_hub>=0.23"]

[project.scripts]
modifyllm = "modifyllm.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modifyllm = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "hf: needs torch (+transformers) — tiny random models, no downloads",
  "hf_nightly: real-model run — downloads pinned weights, minutes-scale",
]
